# UnfoldAll standard offline collection config

seed: 42
decimation: 1
num_stabilization_steps_on_reset: 50
vertex_control_enabled: true
kinematic_mass_multiplier: 0.0

randomize_on_reset: true
steps_per_episode: 4
episodes_per_asset_batch: 8

assets_root: "./data/assets"
garment_categories: ["Dress", "Tops", "Trousers"]
enable_textures: false
spawn_cfg:
  init_euler_deg: [0.0, 0.0, 180.0]
  center: [0.0, 0.0, 1.5]
  range: [0.0, 0.0, 0.2]
  rot_range_deg: [180.0, 180.0, 360.0]
  predrop_relift:
    enabled: false
    rerandomize_orientation: true
    height_range: [0.8, 1.2]
    xy_jitter: [0.05, 0.05]

random_policy:
  min_grasp_dist: 0.2
  num_angles: 16
  num_scales: 5

sim:
  dt: 0.016666666666666666
  render_interval: 1

action_sequence:
  loading_mode: y_gravity
  pair_pose_velocity: 0.4
  lifting:
    ground_clearance: 0.03
  fling:
    stretch_pose_velocity: 0.16
    height_adjust_velocity: 0.6
    height_adjust_max_step: 0.05
    height_adjust_target_clearance: 0.12
    height_adjust_bulk_target_clearance: 0.08
    height_adjust_bulk_quantile: 0.10
    height_adjust_tolerance: 0.01
    height_adjust_max_rounds: 200
    height_adjust_settle_steps: 4
    pre_stretch_settle_steps: 6
    forward_y: 0.40
    backward_y: 0.00
    backward_height: 0.06
    swing_velocity: 1.5
    backward_hold_steps: 4
  y_gravity:
    stretch_pose_velocity: 0.4
    pre_stretch_hold_steps: 30
    conditioned_pre_stretch_hold_steps: 90
    post_stretch_hold_steps: 30
  holding:
    gravity_switch:
      duration_steps: 60
    lower_vertices:
      ground_height_offset: 0.02
    gravity_restore:
      duration_steps: 20
  stabilizing:
    max_duration_steps: 100
    velocity_threshold: 0.1

normal_motion_velocity: 1.0
stretch_motion_velocity: 0.5
deformable_weight: 0.65
stretch_max_distance: 2.0
stretch_strain_threshold: 2.0
check_interval: 3

scene:
  num_envs: 32
  env_spacing: 2.0
  replicate_physics: false
  clone_in_fabric: true

garment_physics:
  solver_position_iteration_count: 16
  friction: 0.8
  particle_friction_scale: 1.0
  adhesion: 0.1
  particle_adhesion_scale: 2.0
  particle_mass: 0.0001
  gravity_scale: 1.0
  stretch_stiffness: 1500.0
  bend_stiffness: 0.05
  shear_stiffness: 1.0
  spring_damping: 0.1
  damping: 0.5
  contact_offset: 0.015
  rest_offset: 0.012
  particle_contact_offset: 0.015
  fluid_rest_offset: 0.012
  solid_rest_offset: 0.012
  max_depenetration_velocity: 1.0
  max_velocity: 3.0
  scale: [0.0085, 0.0085, 0.0085]

ground_physics:
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0

debug:
  rigid_fixed_y: false
  protocol_trace: false
  stretch_trace: false

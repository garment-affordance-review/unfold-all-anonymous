# UnfoldAll pair-conditioned distributed collection config

seed: 42
decimation: 1
num_stabilization_steps_on_reset: 50
vertex_control_enabled: true
kinematic_mass_multiplier: 0.0

randomize_on_reset: true
steps_per_episode: 4
episodes_per_asset_batch: 8

assets_root: "./data/assets"
garment_categories: ["Dress", "Tops", "Trousers"]
enable_textures: false
spawn_cfg:
  init_euler_deg: [0.0, 0.0, 180.0]
  center: [0.0, 0.0, 1.5]
  range: [0.0, 0.0, 0.2]
  rot_range_deg: [180.0, 180.0, 360.0]

random_policy:
  min_grasp_dist: 0.2
  num_angles: 16
  num_scales: 5

pair_conditioned_collection:
  output_root: "data/clothes"
  # coord is voxel-downsampled from the USD-derived template pose used by reset_to_poses.
  # Changing this voxel size changes both the training input density and the reward sampling set.
  coord_voxel_size: 0.01
  anchor_fps_count: 128
  pairs_per_asset: 512
  pair_distance_bins: 4
  pair_target_height: 1.5
  resume: true
  save_debug_vis: false

distributed_collection:
  enabled: true
  gpu_ids: [0, 1]
  num_envs_per_gpu: 64
  entrypoint: "offline_pair_conditioned"

sim:
  dt: 0.016666666666666666
  render_interval: 1

action_sequence:
  lifting:
    height: 0.25
  holding:
    gravity_switch:
      duration_steps: 60
    lower_vertices:
      ground_height_offset: 0.02
    gravity_restore:
      duration_steps: 20
  stabilizing:
    max_duration_steps: 100
    velocity_threshold: 0.1

normal_motion_velocity: 1.0
stretch_motion_velocity: 0.5
deformable_weight: 0.65
stretch_max_distance: 2.0
stretch_strain_threshold: 2.0
check_interval: 3

scene:
  num_envs: 32
  env_spacing: 2.0
  replicate_physics: false
  clone_in_fabric: true

garment_physics:
  solver_position_iteration_count: 16
  friction: 0.8
  particle_friction_scale: 1.0
  adhesion: 0.1
  particle_adhesion_scale: 2.0
  particle_mass: 0.0001
  gravity_scale: 1.0
  stretch_stiffness: 1500.0
  bend_stiffness: 0.05
  shear_stiffness: 1.0
  spring_damping: 0.1
  damping: 0.5
  contact_offset: 0.015
  rest_offset: 0.012
  particle_contact_offset: 0.015
  fluid_rest_offset: 0.012
  solid_rest_offset: 0.012
  max_depenetration_velocity: 1.0
  max_velocity: 3.0
  scale: [0.0085, 0.0085, 0.0085]

ground_physics:
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
